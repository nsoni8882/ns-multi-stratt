<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6EEE3" />
    <meta name="color-scheme" content="light" />
    <title>Multi Strategy</title>
    <meta name="description" content="S&P 500 strategy signals on the Daily and 4H charts." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23CC785C'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      // Ask for the data now rather than after the bundle has downloaded, parsed and mounted
      // React — on a cold load that was about 200ms of doing nothing. The route is already in
      // the hash at this point, so the list a visitor actually asked for can be fetched too.
      // api.ts adopts these requests; see headStart() there.
      (function () {
        var hash = location.hash;
        var paths = ["strategies.json", "market.json", "health.json"];
        var onStrategy = hash.match(/^#\/strategy\/([^/?#]+)/);
        if (onStrategy) paths.push(onStrategy[1] + "/" + (/[?&]tf=4h/.test(hash) ? "4h" : "1d") + ".json");
        var started = {};
        paths.forEach(function (path) {
          var request = fetch("%BASE_URL%data/" + path);
          request.catch(function () {}); // marks it handled; the real consumer still sees it reject
          started[path] = request;
        });
        window.__preload = started;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
