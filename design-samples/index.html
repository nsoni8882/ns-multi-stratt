<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Strategy - Design Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Lora:wght@500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Sample-picker chrome (not part of the designs) ---------- */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#222;color:#eee}
.picker{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:#111;border-bottom:1px solid #333;font-size:13px}
.picker b{color:#fff}
.picker button{font:inherit;color:#ddd;background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:6px 12px;cursor:pointer}
.picker button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.picker .note{color:#999;margin-left:auto}
#stage{background:#fff}

/* ---------- Shared building blocks ---------- */
.d{min-height:calc(100vh - 52px);color:var(--text);background:var(--bg);font-family:var(--sans);font-size:15px;line-height:1.5}
.d *{box-sizing:border-box}
.d h1,.d h2,.d h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em;color:var(--text)}
.d a{color:inherit;text-decoration:none}
.d button{font:inherit;cursor:pointer;color:inherit}
.d :focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--numfont,inherit)}
.muted{color:var(--muted)}
.seg{display:inline-flex;padding:3px;background:var(--seg-bg);border:1px solid var(--border);border-radius:var(--r-pill)}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:var(--r-pill);font-weight:600;font-size:14px;min-height:34px;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.buy{background:var(--buy-bg);color:var(--buy)}
.pill.sell{background:var(--sell-bg);color:var(--sell)}
.pill svg{width:11px;height:11px}
.tag{font-size:12.5px;color:var(--muted)}
.sample{font-size:12px;color:var(--muted);padding:8px 16px;text-align:center;border-top:1px solid var(--border)}
.foot{padding:20px 24px;color:var(--muted);font-size:12.5px;text-align:center}
.chart svg{width:100%;height:auto;display:block}
.chart .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
table{border-collapse:collapse;width:100%}
.scroll{overflow-x:auto}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12.5px}
th button{background:none;border:0;padding:0;color:inherit;font:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Direction A: Parchment ---------- */
.A{--bg:#FAF9F5;--surface:#fff;--border:#E8E6DC;--text:#1F1E1D;--muted:#5F5D55;--accent:#B5502F;--accent-fill:#D97757;--ring:#D97757;
--buy:#25704A;--buy-bg:#E5F1EA;--sell:#A32E47;--sell-bg:#F8E6EA;--seg-bg:#F0EEE6;--r-pill:999px;--sans:Inter,system-ui,sans-serif;--serif:Lora,Georgia,serif}
.A .top{display:flex;align-items:center;gap:20px;padding:14px 28px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.A .brand{font-family:var(--serif);font-weight:600;font-size:20px;display:flex;align-items:center;gap:10px}
.A .dot{width:22px;height:22px;border-radius:7px;background:var(--accent-fill)}
.A nav{display:flex;gap:4px}
.A nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.A nav a[aria-current=page]{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.A .top .seg{margin-left:auto}
.A main{max-width:1180px;margin:0 auto;padding:36px 28px}
.A .hero h1{font-size:34px;margin-bottom:6px}
.A .hero p{margin:0 0 28px;color:var(--muted);max-width:56ch}
.A .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.A .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s,transform .2s}
.A .card:hover{box-shadow:0 6px 24px rgba(31,30,29,.07)}
.A .card h2{font-size:21px}
.A .counts{display:flex;gap:10px}
.A .count{flex:1;border-radius:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--border)}
.A .count .n{font-size:26px;font-weight:600;line-height:1.1}
.A .count.b .n{color:var(--buy)}.A .count.s .n{color:var(--sell)}
.A .link{color:var(--accent);font-weight:600}
.A .split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
.A .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.A .tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.A .tools input,.A .tools select{font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:40px}
.A td,.A th{padding:11px 14px;border-bottom:1px solid var(--border)}
.A tbody tr{cursor:pointer}
.A tbody tr:hover{background:#FBF4EF}
.A tbody tr[aria-selected=true]{background:#FCEFE8;box-shadow:inset 3px 0 0 var(--accent-fill)}
.A .cpanel{padding:18px;position:sticky;top:16px}
.A .cpanel h3{font-size:19px}
@media(max-width:980px){.A .split{grid-template-columns:1fr}.A .cpanel{position:static}}

/* ---------- Direction B: Ink & Sand (dense, sidebar) ---------- */
.B{--bg:#F3F1EA;--surface:#FBFAF6;--border:#DEDACC;--text:#26241F;--muted:#625F56;--accent:#A9482A;--accent-fill:#C8623F;--ring:#C8623F;
--buy:#1D6F46;--buy-bg:#DFEEE5;--sell:#A62B2B;--sell-bg:#F5E1DE;--seg-bg:#E8E5DA;--r-pill:8px;--sans:"IBM Plex Sans",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,serif;--numfont:"IBM Plex Mono",monospace}
.B{display:grid;grid-template-columns:230px minmax(0,1fr)}
.B aside{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.B .brand{font-family:var(--serif);font-weight:600;font-size:19px;padding:4px 10px 16px}
.B aside a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-weight:500;color:var(--muted)}
.B aside a[aria-current=page]{background:#EFE2DA;color:var(--text)}
.B aside .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.B .badge{font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0 6px}
.B .bar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.B .bar h1{font-size:22px}
.B .bar .seg{margin-left:auto}
.B .content{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.B .box{background:var(--surface);border:1px solid var(--border);border-radius:8px}
.B td,.B th{padding:7px 12px;border-bottom:1px solid var(--border)}
.B th{background:#F0EEE6;position:sticky;top:0}
.B tbody tr{cursor:pointer}.B tbody tr:hover{background:#F6EEE8}
.B tbody tr[aria-selected=true]{background:#F3E4DB}
.B .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.B .kpi{padding:12px 14px}.B .kpi .n{font-size:24px;font-weight:600}
.B .tools{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.B .tools input,.B .tools select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);min-height:36px}
.B .drawer{padding:16px}
.B .hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
@media(max-width:860px){.B{grid-template-columns:1fr}.B aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border)}.B aside .lbl{display:none}.B .kpis{grid-template-columns:1fr 1fr}}

/* ---------- Direction C: Soft Cards ---------- */
.C{--bg:#FFFBF6;--surface:#fff;--border:#EFE6DB;--text:#2A2623;--muted:#625C55;--accent:#A5472A;--accent-fill:#CC785C;--ring:#CC785C;
--buy:#27694B;--buy-bg:#E3F0E7;--sell:#9E2F45;--sell-bg:#F9E4E8;--seg-bg:#F6EDE3;--r-pill:999px;--sans:Inter,system-ui,sans-serif;--serif:Lora,Georgia,serif}
.C .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;flex-wrap:wrap}
.C .brand{font-family:var(--serif);font-size:22px;font-weight:600}
.C nav{display:flex;gap:6px;background:var(--seg-bg);padding:4px;border-radius:999px}
.C nav a{padding:7px 16px;border-radius:999px;font-weight:500;color:var(--muted)}
.C nav a[aria-current=page]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(42,38,35,.12)}
.C main{max-width:1120px;margin:0 auto;padding:12px 32px 40px}
.C .hero{text-align:center;padding:20px 0 28px}
.C .hero h1{font-size:40px}
.C .hero p{color:var(--muted);margin:8px auto 0;max-width:52ch}
.C .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.C .stat{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 20px}
.C .stat .n{font-family:var(--serif);font-size:32px;font-weight:600}
.C .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.C .bigcard{border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--border)}
.C .bigcard.one{background:#FDEFE6}.C .bigcard.two{background:#EAF2EC}
.C .bigcard h2{font-size:24px}
.C .row{display:flex;gap:10px;align-items:center}
.C .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.C .scard{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,transform .2s}
.C .scard:hover{box-shadow:0 8px 24px rgba(42,38,35,.09);transform:translateY(-2px)}
.C .scard .tk{font-family:var(--serif);font-size:22px;font-weight:600}
.C .spark{width:100%;height:36px}
.C .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.C .tools input,.C .tools select{font:inherit;padding:9px 16px;border:1px solid var(--border);border-radius:999px;background:var(--surface);min-height:42px}
.C .modal{position:fixed;inset:0;background:rgba(42,38,35,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.C .sheet{background:var(--surface);border-radius:24px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.C .sheet .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.C .x{border:1px solid var(--border);background:var(--bg);border-radius:999px;width:40px;height:40px}
@media(max-width:700px){.C .stats{grid-template-columns:1fr}.C .hero h1{font-size:30px}}
</style>
</head>
<body>
<div class="picker" role="toolbar" aria-label="Sample picker">
  <b>Design sample</b>
  <span id="dirs"></span>
  <span id="views"></span>
  <span class="note">Sample data only. Timeframe selector is live (defaults to 1D); click a row/card for the chart.</span>
</div>
<div id="stage"></div>

<script>
/* ---------- Mock data (illustrative only) ---------- */
const STRATS=[
 {id:'macd',name:'MACD + RSI Reversal',desc:'BUY when the MACD histogram climbs back from a deep low while RSI(14) crosses back above 20. SELL is the mirror at 80.'},
 {id:'trend',name:'Trend Pullback',desc:'BUY when price is above the 200 EMA with the 50 EMA above it, and RSI(14) dips below 40 then crosses back above. SELL is the mirror.'}];
const ROWS={
 macd:{ '1d':[['XOM','Exxon Mobil','Energy',108.42,'BUY',0],['PFE','Pfizer','Health Care',24.15,'BUY',1],['INTC','Intel','Information Technology',19.87,'BUY',2],['NVDA','NVIDIA','Information Technology',231.6,'SELL',0],['TSLA','Tesla','Consumer Discretionary',312.9,'SELL',1]],
        '4h':[['AAL','American Airlines','Industrials',11.2,'BUY',0],['KHC','Kraft Heinz','Consumer Staples',26.4,'BUY',1],['META','Meta Platforms','Communication Services',702.3,'SELL',0]]},
 trend:{'1d':[['AAPL','Apple','Information Technology',333.26,'BUY',0],['MSFT','Microsoft','Information Technology',512.1,'BUY',1],['JPM','JPMorgan Chase','Financials',301.7,'BUY',0],['COST','Costco','Consumer Staples',905.4,'BUY',2],['KO','Coca-Cola','Consumer Staples',66.2,'SELL',0],['VZ','Verizon','Communication Services',38.9,'SELL',1]],
        '4h':[['AMZN','Amazon','Consumer Discretionary',221.5,'BUY',0],['GOOGL','Alphabet','Communication Services',204.8,'BUY',1],['T','AT&T','Communication Services',27.1,'SELL',0],['PEP','PepsiCo','Consumer Staples',142.9,'SELL',1]]}};
const arrow={BUY:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2l4 5H2z" fill="currentColor"/></svg>',SELL:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10L2 5h8z" fill="currentColor"/></svg>'};
const pill=s=>`<span class="pill ${s.toLowerCase()}">${arrow[s]}${s}</span>`;
const barsAgo=(n,tf)=>n===0?'Latest bar':`${n} bar${n>1?'s':''} ago`;
const counts=(id,tf)=>{const r=ROWS[id][tf];return{buy:r.filter(x=>x[4]==='BUY').length,sell:r.filter(x=>x[4]==='SELL').length}};

/* ---------- Mock chart (seeded path shaped around the signal + real EMA/RSI/MACD math) ---------- */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
const N=300,SHOW=90;
function series(row,tf,sid){
  const sig=N-1-row[5],buy=row[4]==='BUY';
  let s=[...row[0]+tf].reduce((a,c)=>a*31+c.charCodeAt(0),7)%2147483000||11,r=rng(s),p=100,out=[];
  const vol=tf==='4h'?.012:.018;
  for(let i=0;i<N;i++){
    let drift;
    if(sid==='trend'){drift=buy?.0016:-.0016;if(i===sig)drift=buy?.022:-.022;else if(i>sig-5&&i<sig)drift=buy?-.011:.011;else if(i>sig)drift=buy?.009:-.009}
    else{drift=.0004;if(i===sig)drift=buy?.045:-.045;else if(i>sig-14&&i<sig)drift=buy?-.009:.009;else if(i>sig)drift=buy?.009:-.009}
    const o=p,c=p*(1+(r()-.5)*vol+drift);
    out.push({o,h:Math.max(o,c)*(1+r()*.006),l:Math.min(o,c)*(1-r()*.006),c});p=c}
  const k=row[3]/out[sig].c;return out.map(x=>({o:x.o*k,h:x.h*k,l:x.l*k,c:x.c*k}))}
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
function rsi(c,n=14){const o=Array(c.length).fill(null);let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];g+=Math.max(d,0);l+=Math.max(-d,0)}g/=n;l/=n;o[n]=100-100/(1+g/(l||1e-9));
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=100-100/(1+g/(l||1e-9))}return o}
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor((s.length-1)*q)]};
function labels(tf){ // mock time axis, ending Fri 2 Oct 2026
  const out=[];let d=new Date(Date.UTC(2026,9,2,tf==='4h'?16:0,0));
  for(let i=0;i<SHOW;i++){out.unshift(new Date(d));if(tf==='4h'){const h=d.getUTCHours();if(h>14){d.setUTCHours(13,30)}else{d.setUTCDate(d.getUTCDate()-1);d.setUTCHours(16,0)}}else d.setUTCDate(d.getUTCDate()-1);while([0,6].includes(d.getUTCDay()))d.setUTCDate(d.getUTCDate()-1)}
  return out}
function chartSVG(row,tf,pal,sid){
  const all=series(row,tf,sid),off=N-SHOW,c=all.map(x=>x.c),d=all.slice(off),buy=row[4]==='BUY';
  const e50=ema(c,50),e200=ema(c,200),rs=rsi(c),m=ema(c,12).map((v,i)=>v-ema(c,26)[i]),sg=ema(m,9),h=m.map((v,i)=>v-sg[i]);
  const W=700,AX=56,pad=6,pw=W-AX-pad,cw=pw/SHOW,X=i=>pad+cw*i+cw/2,si=SHOW-1-row[5],col=buy?pal.buy:pal.sell;
  const P1=[10,270],P2=[296,420],P3=[446,556],H=582,txt=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-size="10.5" fill="${pal.muted}" ${o}>${t}</text>`;
  let lo=Math.min(...d.map(x=>x.l)),hi=Math.max(...d.map(x=>x.h));
  if(sid==='trend'){const ex=[...e50,...e200].slice(off);lo=Math.min(lo,...ex);hi=Math.max(hi,...ex)}
  const rg=hi-lo;lo-=rg*(buy?.26:.08);hi+=rg*(buy?.08:.26);const py=v=>P1[0]+(1-(v-lo)/(hi-lo))*(P1[1]-P1[0]);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${row[0]} ${tf} candlestick chart with ${row[4]} signal marker, RSI and MACD panes (sample data)">`;
  // grid + right price axis
  for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4,y=py(v);s+=`<line x1="0" x2="${W-AX}" y1="${y}" y2="${y}" stroke="${pal.grid}"/>`+txt(W-AX+6,y+3.5,v.toFixed(1))}
  // vertical time grid + time axis
  const L=labels(tf);[0,22,44,66,89].forEach(i=>{const x=X(i);s+=`<line x1="${x}" x2="${x}" y1="${P1[0]}" y2="${P3[1]}" stroke="${pal.grid}" opacity=".6"/>`+txt(x-18,H-6,tf==='4h'?L[i].toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}):L[i].toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}))});
  // EMAs (trend strategy only)
  if(sid==='trend'){[[e50,pal.e1],[e200,pal.e2]].forEach(([e,cl])=>{s+=`<polyline fill="none" stroke="${cl}" stroke-width="1.6" points="${e.slice(off).map((v,i)=>X(i)+','+py(v)).join(' ')}"/>`})}
  // candles
  d.forEach((k,i)=>{const up=k.c>=k.o,cl=up?pal.up:pal.down;s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${py(k.h)}" y2="${py(k.l)}" stroke="${cl}"/><rect x="${X(i)-cw*.34}" y="${py(Math.max(k.o,k.c))}" width="${cw*.68}" height="${Math.max(1.5,Math.abs(py(k.o)-py(k.c)))}" fill="${up?cl:pal.bg}" stroke="${cl}"/>`});
  // signal: faint vertical guide through all panes + labelled arrow marker on the signal candle
  s+=`<line x1="${X(si)}" x2="${X(si)}" y1="${P1[0]}" y2="${P3[1]}" stroke="${col}" stroke-dasharray="3 4" opacity=".55"/>`;
  const k=d[si],mx=X(si);
  if(buy){const y=py(k.l)+8;s+=`<path d="M${mx} ${y} l7 11 h-4.5 v6 h-5 v-6 h-4.5z" fill="${col}"/><rect x="${mx-17}" y="${y+19}" width="34" height="17" rx="5" fill="${col}"/><text x="${mx}" y="${y+31.5}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">BUY</text>`}
  else{const y=py(k.h)-8;s+=`<path d="M${mx} ${y} l7 -11 h-4.5 v-6 h-5 v6 h-4.5z" fill="${col}"/><rect x="${mx-17}" y="${y-36}" width="34" height="17" rx="5" fill="${col}"/><text x="${mx}" y="${y-23.5}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SELL</text>`}
  // last price tag
  const last=d[SHOW-1],ly=py(last.c);s+=`<line x1="0" x2="${W-AX}" y1="${ly}" y2="${ly}" stroke="${last.c>=last.o?pal.up:pal.down}" stroke-dasharray="2 3" opacity=".7"/><rect x="${W-AX+1}" y="${ly-9}" width="${AX-2}" height="18" rx="3" fill="${last.c>=last.o?pal.up:pal.down}"/><text x="${W-AX+AX/2}" y="${ly+4}" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">${last.c.toFixed(1)}</text>`;
  s+=txt(8,24,`${row[0]} · ${tf.toUpperCase()}   O ${last.o.toFixed(2)}  H ${last.h.toFixed(2)}  L ${last.l.toFixed(2)}  C ${last.c.toFixed(2)}`,'font-weight="500"');
  // ---- RSI pane ----
  const ry=v=>P2[0]+18+(1-v/100)*(P2[1]-P2[0]-24),lv=sid==='trend'?[40,60]:[20,80];
  s+=`<rect x="0" y="${ry(lv[1])}" width="${W-AX}" height="${ry(lv[0])-ry(lv[1])}" fill="${pal.accent}" opacity=".07"/>`;
  [30,50,70].forEach(v=>{s+=`<line x1="0" x2="${W-AX}" y1="${ry(v)}" y2="${ry(v)}" stroke="${pal.grid}" stroke-dasharray="${v===50?'1 4':'5 4'}"/>`+(lv.every(l=>Math.abs(l-v)>=15)?txt(W-AX+6,ry(v)+3.5,v):'')});
  lv.forEach(v=>{s+=`<line x1="0" x2="${W-AX}" y1="${ry(v)}" y2="${ry(v)}" stroke="${pal.accent}" stroke-width="1.2"/><rect x="${W-AX+1}" y="${ry(v)-8}" width="${AX-2}" height="16" rx="3" fill="${pal.accent}"/><text x="${W-AX+AX/2}" y="${ry(v)+4}" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">${v}</text>`});
  s+=`<rect x="0" y="${P2[0]}" width="${W-AX}" height="${P2[1]-P2[0]}" fill="none" stroke="${pal.grid}"/><polyline fill="none" stroke="${pal.rsi}" stroke-width="1.7" points="${rs.slice(off).map((v,i)=>X(i)+','+ry(v)).join(' ')}"/><circle cx="${X(si)}" cy="${ry(rs[off+si])}" r="4" fill="${col}" stroke="${pal.bg}" stroke-width="1.5"/>`;
  s+=txt(8,P2[0]+14,`RSI 14   ${rs[N-1].toFixed(1)}   (strategy levels ${lv[0]} / ${lv[1]})`,'font-weight="500"');
  // ---- MACD pane ----
  const sh=h.slice(off),sm=m.slice(off),ss=sg.slice(off),mm=Math.max(...sh.map(Math.abs),...sm.map(Math.abs),...ss.map(Math.abs))*1.15||1,my=v=>(P3[0]+P3[1])/2+7-(v/mm)*((P3[1]-P3[0])/2-12);
  s+=`<rect x="0" y="${P3[0]}" width="${W-AX}" height="${P3[1]-P3[0]}" fill="none" stroke="${pal.grid}"/><line x1="0" x2="${W-AX}" y1="${my(0)}" y2="${my(0)}" stroke="${pal.muted}" opacity=".7"/>`+txt(W-AX+6,my(0)+3.5,'0');
  if(sid!=='trend'){const dl=quant(h.slice(-100),.10),dh=quant(h.slice(-100),.90);const gap=Math.abs(my(dl)-my(dh));[[dh,'Deep high',gap<18?-9:0],[dl,'Deep low',gap<18?9:0]].forEach(([v,t,o])=>{s+=`<line x1="0" x2="${W-AX}" y1="${my(v)}" y2="${my(v)}" stroke="${pal.accent}" stroke-dasharray="5 4" stroke-width="1.2"/><rect x="${W-AX+1}" y="${my(v)-8+o}" width="${AX-2}" height="16" rx="3" fill="${pal.accent}"/><text x="${W-AX+AX/2}" y="${my(v)+4+o}" font-size="9.5" font-weight="600" fill="#fff" text-anchor="middle">${t}</text>`})}
  sh.forEach((v,i)=>{const rising=i>0?v>sh[i-1]:true,cl=v>=0?pal.up:pal.down;s+=`<rect x="${X(i)-cw*.34}" y="${Math.min(my(0),my(v))}" width="${cw*.68}" height="${Math.max(.5,Math.abs(my(v)-my(0)))}" fill="${cl}" opacity="${(v>=0)===rising?.9:.38}"/>`});
  s+=`<polyline fill="none" stroke="${pal.macd}" stroke-width="1.5" points="${sm.map((v,i)=>X(i)+','+my(v)).join(' ')}"/><polyline fill="none" stroke="${pal.sig}" stroke-width="1.5" points="${ss.map((v,i)=>X(i)+','+my(v)).join(' ')}"/>`;
  s+=txt(8,P3[0]+14,`MACD 12 26 9   hist ${h[N-1].toFixed(2)}   MACD ${m[N-1].toFixed(2)}   signal ${sg[N-1].toFixed(2)}`,'font-weight="500"');
  s+='</svg>';
  const lg=sid==='trend'?`<span><i class="sw" style="background:${pal.e1}"></i>EMA 50</span><span><i class="sw" style="background:${pal.e2}"></i>EMA 200</span>`:'';
  return s+`<div class="legend">${lg}<span><i class="sw" style="background:${pal.rsi}"></i>RSI</span><span><i class="sw" style="background:${pal.macd}"></i>MACD</span><span><i class="sw" style="background:${pal.sig}"></i>Signal</span><span>Hollow candle = down bar</span></div>`}
const PAL={A:{grid:'#EDEBE2',up:'#25704A',down:'#A32E47',bg:'#fff',e1:'#C98A2B',e2:'#2F5D8A',accent:'#B5502F',muted:'#5F5D55',buy:'#25704A',sell:'#A32E47',rsi:'#6B4FA3',macd:'#2F5D8A',sig:'#C98A2B'},
 B:{grid:'#E4E0D2',up:'#1D6F46',down:'#A62B2B',bg:'#FBFAF6',e1:'#B8761B',e2:'#2A5A86',accent:'#A9482A',muted:'#625F56',buy:'#1D6F46',sell:'#A62B2B',rsi:'#65489B',macd:'#2A5A86',sig:'#B8761B'},
 C:{grid:'#F3EBE0',up:'#27694B',down:'#9E2F45',bg:'#fff',e1:'#C98A2B',e2:'#2F5D8A',accent:'#A5472A',muted:'#625C55',buy:'#27694B',sell:'#9E2F45',rsi:'#6B4FA3',macd:'#2F5D8A',sig:'#C98A2B'}};

/* ---------- State ---------- */
let dir='A';try{dir=localStorage.getItem('dir2')||'C'}catch{}
let view='home',tf='1d',sid='macd',sel=null,filter='ALL',q='';
const $=s=>document.querySelector(s);
const tfSeg=()=>`<div class="seg" role="group" aria-label="Timeframe"><button aria-pressed="${tf==='1d'}" data-tf="1d">1D</button><button aria-pressed="${tf==='4h'}" data-tf="4h">4H</button></div>`;
const upd=()=>`Updated 2 Oct 2026, 4:05 PM ET`;
const filtered=()=>ROWS[sid][tf].filter(r=>(filter==='ALL'||r[4]===filter)&&(r[0]+r[1]).toLowerCase().includes(q.toLowerCase()));
const nav=(cls)=>`<nav aria-label="Primary"><a href="#" data-go="home" ${view==='home'?'aria-current="page"':''}>Home</a>${STRATS.map(s=>`<a href="#" data-go="${s.id}" ${view==='strategy'&&sid===s.id?'aria-current="page"':''}>${s.id==='macd'?'MACD + RSI':'Trend Pullback'}</a>`).join('')}</nav>`;
const tools=()=>`<div class="tools"><div class="seg" role="group" aria-label="Signal filter">${['ALL','BUY','SELL'].map(f=>`<button aria-pressed="${filter===f}" data-f="${f}">${f==='ALL'?'All':f}</button>`).join('')}</div><label><span class="sr" style="position:absolute;left:-9999px">Search</span><input id="q" placeholder="Search ticker or name" value="${q}"></label><select aria-label="Sector"><option>All sectors</option><option>Energy</option><option>Financials</option><option>Information Technology</option></select></div>`;
const tableRows=()=>{const rows=filtered();if(!rows.length)return `<tr><td colspan="6" class="muted" style="padding:28px;text-align:center">No signals right now for these filters.</td></tr>`;
 return rows.map(r=>`<tr tabindex="0" data-t="${r[0]}" aria-selected="${sel&&sel[0]===r[0]}"><td><b>${r[0]}</b><div class="tag">${r[1]}</div></td><td class="muted">${r[2]}</td><td class="num">$${r[3].toFixed(2)}</td><td>${pill(r[4])}</td><td class="muted">${barsAgo(r[5],tf)}</td></tr>`).join('')};
const table=()=>`<div class="scroll"><table><thead><tr><th>Ticker</th><th>Sector</th><th>Price</th><th>Signal</th><th>Fired</th></tr></thead><tbody>${tableRows()}</tbody></table></div>`;

/* ---------- Direction renderers ---------- */
function renderA(){
 let body;
 if(view==='home'){body=`<div class="hero"><h1>Today's signals</h1><p>Strategy scans across all S&amp;P 500 stocks, refreshed after each 4H and daily close. ${upd()}.</p></div><div class="cards">${STRATS.map(s=>{const c=counts(s.id,tf);return`<article class="card"><h2>${s.name}</h2><p class="muted" style="margin:0">${s.desc}</p><div class="counts"><div class="count b"><div class="n num">${c.buy}</div><div class="tag">BUY (${tf.toUpperCase()})</div></div><div class="count s"><div class="n num">${c.sell}</div><div class="tag">SELL (${tf.toUpperCase()})</div></div></div><a class="link" href="#" data-go="${s.id}">View signals &rarr;</a></article>`}).join('')}</div>`}
 else{const s=STRATS.find(x=>x.id===sid);body=`<div class="hero" style="margin-bottom:0"><h1>${s.name}</h1><p style="margin-bottom:0">${s.desc}</p></div>${tools()}<div class="split"><div class="panel">${table()}</div><aside class="panel cpanel" aria-live="polite">${sel?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3>${sel[0]} <span class="tag">${sel[1]}</span></h3>${pill(sel[4])}</div><div class="chart">${chartSVG(sel,tf,PAL.A,sid)}</div>`:`<h3>Chart</h3><p class="muted">Select a stock to see its ${tf.toUpperCase()} chart with RSI and MACD.</p>`}</aside></div>`}
 return `<div class="top"><div class="brand"><span class="dot"></span>Multi Strategy</div>${nav()}${tfSeg()}</div><main>${body}</main><div class="foot">Not financial advice. Data from Yahoo Finance, may be delayed or inaccurate.</div>`}

function renderB(){
 const side=`<aside><div class="brand">Multi Strategy</div><a href="#" data-go="home" ${view==='home'?'aria-current="page"':''}>Overview</a><div class="lbl">Strategies</div>${STRATS.map(s=>{const c=counts(s.id,tf);return`<a href="#" data-go="${s.id}" ${view==='strategy'&&sid===s.id?'aria-current="page"':''}><span>${s.id==='macd'?'MACD + RSI':'Trend Pullback'}</span><span class="badge num">${c.buy+c.sell}</span></a>`}).join('')}</aside>`;
 let body;
 if(view==='home'){const tot=STRATS.reduce((a,s)=>{const c=counts(s.id,tf);return{b:a.b+c.buy,s:a.s+c.sell}},{b:0,s:0});
  body=`<div class="kpis"><div class="box kpi"><div class="tag">Active BUY</div><div class="n num" style="color:var(--buy)">${tot.b}</div></div><div class="box kpi"><div class="tag">Active SELL</div><div class="n num" style="color:var(--sell)">${tot.s}</div></div><div class="box kpi"><div class="tag">Stocks scanned</div><div class="n num">503</div></div><div class="box kpi"><div class="tag">Last update</div><div class="n num" style="font-size:16px;padding-top:6px">2 Oct 16:05 ET</div></div></div><div class="box"><table><thead><tr><th>Strategy</th><th>Description</th><th>BUY</th><th>SELL</th><th></th></tr></thead><tbody>${STRATS.map(s=>{const c=counts(s.id,tf);return`<tr><td style="font-weight:600">${s.name}</td><td class="muted" style="max-width:420px">${s.desc}</td><td class="num" style="color:var(--buy);font-weight:600">${c.buy}</td><td class="num" style="color:var(--sell);font-weight:600">${c.sell}</td><td><a href="#" data-go="${s.id}" style="color:var(--accent);font-weight:600">Open</a></td></tr>`}).join('')}</tbody></table></div>`}
 else body=`<div class="box">${tools()}${table()}</div><div class="box drawer chart" aria-live="polite">${sel?`<div class="hdr"><h3>${sel[0]} <span class="tag">${sel[1]} &middot; ${tf.toUpperCase()}</span></h3>${pill(sel[4])}</div>${chartSVG(sel,tf,PAL.B,sid)}`:`<span class="muted">Select a row to open its chart here.</span>`}</div>`;
 return `${side}<div><div class="bar"><h1>${view==='home'?'Overview':STRATS.find(s=>s.id===sid).name}</h1>${tfSeg()}</div><div class="content">${body}</div><div class="foot">Not financial advice. Data from Yahoo Finance, may be delayed or inaccurate.</div></div>`}

function renderC(){
 let body;
 if(view==='home'){const tot=STRATS.reduce((a,s)=>{const c=counts(s.id,tf);return{b:a.b+c.buy,s:a.s+c.sell}},{b:0,s:0});
  body=`<div class="hero"><h1>What's moving today</h1><p>Two strategies, every S&amp;P 500 stock, one calm place to look. ${upd()}.</p></div><div class="stats"><div class="stat"><div class="tag">Buy signals</div><div class="n num" style="color:var(--buy)">${tot.b}</div></div><div class="stat"><div class="tag">Sell signals</div><div class="n num" style="color:var(--sell)">${tot.s}</div></div><div class="stat"><div class="tag">Timeframe</div><div class="n">${tf==='1d'?'Daily':'4 hour'}</div></div></div><div class="big">${STRATS.map((s,i)=>{const c=counts(s.id,tf);return`<article class="bigcard ${i?'two':'one'}"><h2>${s.name}</h2><p style="margin:0;color:var(--muted)">${s.desc}</p><div class="row"><span class="pill buy">${arrow.BUY}${c.buy} BUY</span><span class="pill sell">${arrow.SELL}${c.sell} SELL</span></div><a href="#" data-go="${s.id}" style="font-weight:600;color:var(--accent)">See the stocks &rarr;</a></article>`}).join('')}</div>`}
 else{const s=STRATS.find(x=>x.id===sid),rows=filtered();body=`<div class="hero"><h1>${s.name}</h1><p>${s.desc}</p></div>${tools()}<div class="grid">${rows.length?rows.map(r=>`<button class="scard" data-t="${r[0]}"><div class="row" style="justify-content:space-between"><span class="tk">${r[0]}</span>${pill(r[4])}</div><div class="tag">${r[1]}</div><svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${r[4]==='BUY'?'#27694B':'#9E2F45'}" stroke-width="2" points="${series(r,tf,sid).slice(-30).map((k,i,a)=>{const lo=Math.min(...a.map(x=>x.c)),hi=Math.max(...a.map(x=>x.c));return(i*100/29).toFixed(1)+','+(34-(k.c-lo)/(hi-lo||1)*32).toFixed(1)}).join(' ')}"/></svg><div class="row" style="justify-content:space-between"><span class="num"><b>$${r[3].toFixed(2)}</b></span><span class="tag">${barsAgo(r[5],tf)}</span></div></button>`).join(''):`<p class="muted" style="grid-column:1/-1;text-align:center">No signals right now for these filters.</p>`}</div>`}
 const modal=sel&&view==='strategy'?`<div class="modal" data-close><div class="sheet" role="dialog" aria-label="${sel[0]} chart"><div class="head"><div><h3 style="font-size:26px">${sel[0]}</h3><div class="tag">${sel[1]} &middot; ${sel[2]} &middot; ${tf.toUpperCase()}</div></div><div class="row">${pill(sel[4])}<button class="x" data-close aria-label="Close chart">&times;</button></div></div><div class="chart">${chartSVG(sel,tf,PAL.C,sid)}</div></div></div>`:'';
 return `<div class="top"><div class="brand">Multi Strategy</div>${nav()}${tfSeg()}</div><main>${body}</main><div class="foot">Not financial advice. Data from Yahoo Finance, may be delayed or inaccurate.</div>${modal}`}

/* ---------- Wiring ---------- */
function paint(){
  $('#dirs').innerHTML=[['A','A &middot; Parchment'],['B','B &middot; Ink &amp; Sand'],['C','C &middot; Soft Cards']].map(([k,l])=>`<button data-dir="${k}" aria-pressed="${dir===k}">${l}</button>`).join(' ');
  $('#views').innerHTML=[['home','Home'],['strategy','Strategy page']].map(([k,l])=>`<button data-view="${k}" aria-pressed="${view===k}">${l}</button>`).join(' ');
  $('#stage').innerHTML=`<div class="d ${dir}">${({A:renderA,B:renderB,C:renderC})[dir]()}</div><div class="sample" style="background:#fff;color:#555">Sample data for design review only. Not real signals.</div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-dir],[data-view],[data-tf],[data-go],[data-f],[data-t],[data-close]');if(!t)return;
  if(t.dataset.close!==undefined&&e.target.closest('.sheet')&&!e.target.closest('.x'))return;
  e.preventDefault();
  if(t.dataset.dir){dir=t.dataset.dir;try{localStorage.setItem('dir2',dir)}catch{}}
  else if(t.dataset.view){view=t.dataset.view;sel=null}
  else if(t.dataset.tf){tf=t.dataset.tf;sel=null}
  else if(t.dataset.go){if(t.dataset.go==='home')view='home';else{view='strategy';sid=t.dataset.go}sel=null}
  else if(t.dataset.f)filter=t.dataset.f;
  else if(t.dataset.t)sel=ROWS[sid][tf].find(r=>r[0]===t.dataset.t);
  else if(t.dataset.close!==undefined)sel=null;
  paint()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest('tr[data-t]');if(tr){sel=ROWS[sid][tf].find(r=>r[0]===tr.dataset.t);paint()}}if(e.key==='Escape'&&sel){sel=null;paint()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;paint();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)}});
paint();
</script>
</body>
</html>
