name: Scan and deploy

on:
  schedule:
    # Cron cannot know about holidays, early closes or DST, so these are only wake-up calls: the
    # `gate` job below checks the NYSE calendar and the deployed data, and skips the run unless an
    # update is actually due. Update times are 5 minutes after each bar close (13:30 ET, 16:00 ET,
    # or the close on an early-close day); the wake-ups come 5 minutes after that.
    - cron: "40 17,18 * * 1-5" # 13:40 ET (EDT / EST)
    - cron: "10 20,21 * * 1-5" # 16:10 ET
    - cron: "10 17,18 * * 1-5" # 13:10 ET, early-close days
    - cron: "30 14-23 * * 1-5" # hourly catch-up: if a wake-up was missed, the next one runs the scan
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # push the signal history to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: scan-and-deploy # queue overlapping runs so they never race on the history push
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - id: gate
        name: Is an update due?
        run: |
          # `updated_at` of the data currently deployed (empty if the site is not up yet)
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/strategies.json"
          UPDATED=$(curl -fsS --max-time 20 "$URL" | python -c 'import sys,json;print(json.load(sys.stdin)["updated_at"])' || true)
          echo "deployed data updated_at: ${UPDATED:-unknown}"
          python -m scanner.market --event "${{ github.event_name }}" --updated-at "$UPDATED"

  scan-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out signal history (data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone --quiet --branch data --single-branch --depth 1 "$REMOTE" history
          else
            git init --quiet -b data history
            git -C history remote add origin "$REMOTE"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests gate pushes and manual runs; scheduled data refreshes must not be blocked by dependency drift.
      - run: python -m pytest -q
        if: github.event_name != 'schedule'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
        if: github.event_name != 'schedule'

      # Exits non-zero (skipping everything below) if >10% of tickers fail to fetch.
      - name: Scan the S&P 500
        run: python -m scanner.run --out web/public/data --db history/signals.db

      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Save signal history
        run: |
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.db
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit --quiet -m "signals $(date -u +%FT%TZ)"
            git push --quiet origin HEAD:data
          fi

      # GitHub switches off scheduled workflows after 60 days without repository activity. The
      # history pushes may already count, but an occasional empty commit on main makes sure.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push origin HEAD:main
          fi
