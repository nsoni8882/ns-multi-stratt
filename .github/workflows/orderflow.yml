name: Order flow probe

# Manual only, read-only. A research kill test (lab/orderflow_probe.py): it prints a result to the
# run log and writes nothing to the repo, the ledgers or Pages.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Sessions to sample (1 is a smoke test, 20 is about a month)"
        type: string
        default: "1"
      symbol:
        description: "Ticker"
        type: string
        default: "AAPL"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: lab/.cache/orderflow
          key: orderflow-${{ github.run_id }}
          restore-keys: orderflow-
      - run: pip install -r requirements.txt
      - name: Run the probe
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m lab.orderflow_probe --days "${{ inputs.days }}" --symbol "${{ inputs.symbol }}"
